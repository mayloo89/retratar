# Production deploy: retratar's own Postgres + the app, both in Docker.
#
# Runs alongside the Pi's other Docker-based services (see circl.unlug.ar's
# own compose stack) without touching YunoHost's sudo-restricted native
# Postgres at all — that restriction is exactly why this exists instead of a
# bare systemd binary against a native `postgresql` role. See
# docs/decisions/0004-deploy-behind-existing-yunohost-nginx.md.
#
# The app container uses `network_mode: host`: it lets DATABASE_URL stay a
# literal 127.0.0.1 connection, so nginx's `proxy_pass http://127.0.0.1:8082`
# (see ../deploy/nginx/*.conf) needs no changes — the app binds that address
# directly, same as a bare binary would have. It does NOT, on its own, satisfy
# config.Config.Validate: that check refuses sslmode=disable whenever
# ENV=production, full stop, with no exception for loopback — unlike the dev
# Postgres in ../compose.yaml, which never sets ENV=production at all. That is
# deliberate (see the comment on validateDatabaseURL in internal/config), so
# Postgres here runs with real TLS instead of asking that check to bend:
# sslmode=require in DATABASE_URL, a self-signed cert the `command:` below
# installs at container start. Self-signed is enough because the property
# that matters is "not in clear on the wire," not defending against a
# man-in-the-middle on a single Docker host.
#
# SETUP:
#   1. On the Pi: git clone https://github.com/mayloo89/retratar.git, cd in.
#   2. Generate the Postgres TLS material once (never committed — .key is
#      gitignored, this whole directory is Pi-local):
#        mkdir -p deploy/postgres-tls && cd deploy/postgres-tls
#        openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key \
#          -out server.crt -days 3650 -subj "/CN=retratar-postgres"
#        cd -
#   3. Copy deploy/retratar.env.example to deploy/retratar.env and fill it in
#      (not committed — deploy/retratar.env is gitignored). DATABASE_URL must
#      use sslmode=require, not disable.
#   4. Every command below needs --env-file deploy/retratar.env: that is what
#      feeds POSTGRES_PASSWORD to this file's own ${POSTGRES_PASSWORD}
#      interpolation. docker compose does not read it from deploy/retratar.env
#      automatically just because the compose file lives next to it.
#        docker compose -f deploy/docker-compose.yml --env-file deploy/retratar.env \
#          up -d --build postgres
#   5. Wait for postgres healthy, then turn TLS on. This is a one-time step
#      per data volume — it persists in the volume itself, not in the
#      container, and survives `down`/`up` as long as the `pgdata` volume
#      isn't removed. See the comment on the postgres service's `command:`
#      for why this can't just be a `-c` flag there instead.
#        docker exec retratar-postgres-1 psql -U retratar -d retratar \
#          -c "ALTER SYSTEM SET ssl = on;"
#        docker exec retratar-postgres-1 psql -U retratar -d retratar \
#          -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/tls/server.crt';"
#        docker exec retratar-postgres-1 psql -U retratar -d retratar \
#          -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/tls/server.key';"
#        docker restart retratar-postgres-1   # ssl needs a restart, not just reload
#   6. Run migrations once:
#        docker compose -f deploy/docker-compose.yml --env-file deploy/retratar.env \
#          run --rm app -migrate
#   7. docker compose -f deploy/docker-compose.yml --env-file deploy/retratar.env \
#        up -d --build app
#
# `name:` below is not decoration. Compose otherwise derives the project name
# from this file's parent directory — "deploy" — which collides with any
# other project whose compose file also lives in a directory called `deploy`
# (circl.unlug.ar's does, on this same Pi). Without an explicit name, `up`
# here attaches to that project's containers as "orphans" and can create
# volumes inside its namespace. Ask why before renaming or removing this.
name: retratar

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: retratar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/retratar.env}
      POSTGRES_DB: retratar
    ports:
      # 5432 is already bound by the Pi's native postgresql@15-main (a
      # separate, YunoHost-managed instance unrelated to this one) — 5433
      # avoids that collision. DATABASE_URL in retratar.env must match.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Read-only: the entrypoint below copies these into the volume instead
      # of pointing Postgres at the mount directly, because the key must be
      # owned by the postgres user with 0600 permissions, which a read-only
      # bind mount from the host cannot provide on its own.
      - ./postgres-tls:/tls-src:ro
    # The official image starts as root and drops to the postgres user
    # itself; this copies the cert/key into the data volume with the
    # permissions Postgres insists on before handing off to the real
    # entrypoint, rather than requiring the host-side files to somehow
    # already have the container's internal UID.
    #
    # It does NOT also pass `-c ssl=on ...` here — the official entrypoint's
    # already-initialized path re-execs itself twice (once to drop from root
    # to the postgres user, once to skip re-running initdb) and those `-c`
    # flags do not survive that chain: `pg_settings.source` for `ssl` came
    # back `default`, not `command line`, after starting this way. What does
    # persist is `ALTER SYSTEM`, which writes into the data volume itself —
    # see the one-time setup step below — so this command only needs to get
    # the cert files in place before the ordinary entrypoint runs.
    command: >
      sh -c "
        mkdir -p /var/lib/postgresql/tls &&
        cp /tls-src/server.crt /tls-src/server.key /var/lib/postgresql/tls/ &&
        chmod 600 /var/lib/postgresql/tls/server.key &&
        chown postgres:postgres /var/lib/postgresql/tls/server.crt /var/lib/postgresql/tls/server.key &&
        exec docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retratar -d retratar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      # The Dockerfile gives TARGETARCH a default (`ARG TARGETARCH=amd64`)
      # for a plain `docker build` with no platform context. That default
      # takes precedence over BuildKit's automatic platform-arg injection —
      # `platform:` alone pulls an arm64 base image but does not change
      # what GOARCH the RUN line compiles for, and produces a binary the
      # Pi's kernel refuses to exec. Pass it explicitly instead.
      args:
        TARGETARCH: arm64
    platform: linux/arm64
    network_mode: host
    env_file: retratar.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
