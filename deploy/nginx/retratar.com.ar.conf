# nginx reverse proxy config for retratar's app surface — YunoHost /
# Raspberry Pi deploy, behind Cloudflare (proxied). See
# docs/decisions/0004-deploy-behind-existing-yunohost-nginx.md for why this
# exists instead of the Caddyfile in this same directory.
#
# SETUP:
#   1. In Cloudflare: add retratar.com.ar as a site, set the retratar.com.ar
#      A record to the Pi's public IP, proxied (orange cloud). SSL/TLS mode:
#      Full (strict).
#   2. In Cloudflare: SSL/TLS -> Origin Server -> Create Certificate, covering
#      retratar.com.ar. Save the cert/key it gives you (shown once).
#   3. On the Pi:
#        sudo mkdir -p /etc/nginx/certs/retratar.com.ar
#        sudo cp origin-cert.pem /etc/nginx/certs/retratar.com.ar/crt.pem
#        sudo cp origin-key.pem  /etc/nginx/certs/retratar.com.ar/key.pem
#        sudo chmod 600 /etc/nginx/certs/retratar.com.ar/key.pem
#   4. Install this file and the shared Cloudflare IP allowlist:
#        sudo cp deploy/nginx/retratar.com.ar.conf /etc/nginx/conf.d/retratar.com.ar.conf
#        sudo cp deploy/nginx/cloudflare-ips.conf.inc /etc/nginx/conf.d/cloudflare-ips.conf.inc
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# This cert is a Cloudflare Origin CA cert, not a public Let's Encrypt one —
# it is trusted by Cloudflare's edge only (that's what Full (strict) checks),
# not by browsers directly. That's fine: browsers only ever talk to
# Cloudflare's edge, never straight to this origin. Valid up to 15 years, not
# renewed by certbot/YunoHost — it just doesn't need to be.

# Coarse per-visitor cap for the unauthenticated / cheap-to-abuse write
# endpoints — a second layer in front of the app's own token bucket
# (internal/web/ratelimit.go). Keyed by CF-Connecting-IP, the real visitor
# address Cloudflare sets: $binary_remote_addr here is always a Cloudflare
# edge IP and would bucket the whole edge together.
#
# The map gives that key a fallback: a request with no CF-Connecting-IP (it
# should not get past cloudflare-ips.conf.inc without coming through
# Cloudflare, which always sets the header — but a Cloudflare-internal probe
# from an allowlisted range could) would otherwise have an empty key, and
# nginx does not account an empty key at all. Falling back to the peer address
# keeps every request counted; the app layer counts it regardless.
#
# Both directives are http-context, so they live out here, not in a server
# block. The $retratar_client_ip map is defined here and reused by the pages
# zone in retrat.ar.conf — the two files are always deployed as a pair, and
# nginx resolves the whole http context before evaluating any of it, so the
# order they load in does not matter. Defining the map in both files would be
# a duplicate-directive error.
map $http_cf_connecting_ip $retratar_client_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $retratar_client_ip zone=retratar_app_write:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name retratar.com.ar;
    include /etc/nginx/conf.d/cloudflare-ips.conf.inc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name retratar.com.ar;
    include /etc/nginx/conf.d/cloudflare-ips.conf.inc;

    ssl_certificate     /etc/nginx/certs/retratar.com.ar/crt.pem;
    ssl_certificate_key /etc/nginx/certs/retratar.com.ar/key.pem;

    # Security headers, CSP and cookies are the Go binary's job
    # (internal/web/middleware.go) — nginx only proxies, it does not add or
    # override headers here.

    # Proxy settings, set once at server scope so every location inherits them.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cloudflare puts the real visitor IP here and overwrites anything the
    # visitor sent. The app reads it for rate-limiting and trusts it only
    # because this proxy reaches the app over loopback — see clientIP in
    # internal/web/ratelimit.go.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # The write endpoints get the coarse nginx cap; burst= absorbs a normal
    # user's double-submit, nodelay lets those through immediately rather than
    # queueing them. Everything past the burst is a 429, the same status the
    # app returns, with no body detail. Exact ( = ) matches: the magic-link
    # sub-steps at /login/<token> are a different path and stay on `location /`,
    # already gated there by a single-use token and the nonce cookie. GET
    # /login (the form) also lands here, which is harmless — nobody loads a
    # form ten times a minute.
    location = /login {
        limit_req zone=retratar_app_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8082;
    }
    location = /handle {
        limit_req zone=retratar_app_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8082;
    }
    location = /mood {
        limit_req zone=retratar_app_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
    }

    access_log /var/log/nginx/retratar.com.ar-access.log;
    error_log  /var/log/nginx/retratar.com.ar-error.log;
}
