# nginx reverse proxy config for retratar's pages surface — YunoHost /
# Raspberry Pi deploy, behind Cloudflare (proxied). See
# docs/decisions/0004-deploy-behind-existing-yunohost-nginx.md.
#
# This is a wildcard block, not one file per handle: retrat.ar is proxied
# (orange cloud) in Cloudflare, so Cloudflare's Universal SSL already covers
# *.retrat.ar at the edge. nginx only needs one TLS identity for the whole
# zone, so every handle shares this file — no new file, no new YunoHost
# domain, no new cert step when a handle is added.
#
# SETUP:
#   1. In Cloudflare: add retrat.ar as a site, set retrat.ar and *.retrat.ar
#      A records to the Pi's public IP, proxied (orange cloud).
#      SSL/TLS mode: Full (strict).
#   2. In Cloudflare: SSL/TLS -> Origin Server -> Create Certificate, covering
#      retrat.ar and *.retrat.ar. Save the cert/key it gives you (shown once).
#   3. On the Pi:
#        sudo mkdir -p /etc/nginx/certs/retrat.ar
#        sudo cp origin-cert.pem /etc/nginx/certs/retrat.ar/crt.pem
#        sudo cp origin-key.pem  /etc/nginx/certs/retrat.ar/key.pem
#        sudo chmod 600 /etc/nginx/certs/retrat.ar/key.pem
#   4. Install this file:
#        sudo cp deploy/nginx/retrat.ar.conf /etc/nginx/conf.d/retrat.ar.conf
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# This cert is a Cloudflare Origin CA cert, not a public Let's Encrypt one —
# it is trusted by Cloudflare's edge only (that's what Full (strict) checks),
# not by browsers directly. That's fine: browsers only ever talk to
# Cloudflare's edge, never straight to this origin. It's valid up to 15 years
# and is not renewed by certbot/YunoHost — it just doesn't need to be.

server {
    listen 80;
    listen [::]:80;
    server_name retrat.ar *.retrat.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name retrat.ar *.retrat.ar;

    ssl_certificate     /etc/nginx/certs/retrat.ar/crt.pem;
    ssl_certificate_key /etc/nginx/certs/retrat.ar/key.pem;

    # Security headers, CSP and cookies are the Go binary's job
    # (internal/web/middleware.go) — nginx only proxies, it does not add or
    # override headers here.

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/retrat.ar-access.log;
    error_log  /var/log/nginx/retrat.ar-error.log;
}
