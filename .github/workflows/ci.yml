name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  # Pinned: a golangci-lint release must not fail an unrelated pull request.
  LINT_VERSION: "v2.12.2"

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    # The database tests run against a real Postgres, not a fake. Deliberately a
    # service on the existing job instead of a job of its own: the branch ruleset
    # binds required checks by exact job name, so a new job silently stops being
    # required until somebody remembers to edit the protection.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retratar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      # Without this, generated code edited by hand drifts from the SQL it
      # claims to come from, and every review reads a lie.
      - name: Verify sqlc output is current
        run: go tool sqlc diff

      # CI is set by GitHub, and the test helper turns a missing DATABASE_URL
      # into a failure when it is. A skipped database test reads as a pass.
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/retratar_test?sslmode=disable
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      # Printed rather than gated. A hard floor on a young codebase pushes you
      # to write tests that raise the number instead of tests that catch bugs.
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -trimpath ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.LINT_VERSION }}

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: govulncheck
        run: go tool govulncheck ./...

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is built and thrown away. This job exists so a change that
      # breaks the build is caught here rather than during a deploy.
      - name: Build image
        run: docker build --tag retratar:ci .

      # Read from the image config, not from inside the container: the base is
      # distroless, so there is no shell and no id binary to ask.
      - name: Image runs as a non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' retratar:ci)
          echo "image user: ${user:-<empty, means root>}"
          case "$user" in
            ""|root|root:*|0|0:*) echo "::error::image would run as root"; exit 1 ;;
          esac
