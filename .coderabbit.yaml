# CodeRabbit reviews pull requests. This file decides what it is for, which
# matters more here than usual: CI already runs golangci-lint, gosec, CodeQL,
# govulncheck and the tests, and a reviewer that repeats them adds noise without
# adding a single decision. What CI cannot check is whether the design is right
# and whether a test actually fails when the bug it claims to catch is present.
# That is the job left over, and this config points the review at it.
#
# CodeRabbit reads this file from the branch under review, not from the default
# branch, so a change here takes effect on its own pull request.
language: en-US

reviews:
  # chill, not assertive: assertive turns into nit-picking, and a review nobody
  # reads to the end is worse than a shorter one.
  profile: chill
  poem: false
  high_level_summary: true
  review_status: true

  auto_review:
    enabled: true
    # develop is the default branch and every feature branch targets it; main
    # only receives releases. Both are listed so a release pull request is
    # reviewed like any other.
    base_branches:
      - develop
      - main
    # A draft is work in progress by definition. Reviewing one spends a review
    # on code the author already knows is unfinished.
    drafts: false

  tools:
    # Off on purpose. The Lint job already runs golangci-lint against
    # .golangci.yml and blocks the merge when it fails, so a second opinion
    # cannot change the outcome, only the number of places the same finding is
    # reported. Turn this on only if CI stops being the authority on lint.
    golangci-lint:
      enabled: false

  path_instructions:
    # The generated sqlc output stays visible to the reviewer rather than being
    # filtered out: without it the reviewer cannot tell whether a call in
    # internal/user passes the right parameters. It just must not be reviewed
    # as if a person wrote it.
    - path: "internal/store/*.sql.go"
      instructions: >-
        Generated by sqlc from internal/store/queries/*.sql. Do not comment on
        this file. If something here is wrong, the fault is in the .sql query or
        in sqlc.yaml, so report it there instead.
    - path: "internal/store/db.go"
      instructions: >-
        Generated by sqlc. Do not comment on this file.
    - path: "internal/store/models.go"
      instructions: >-
        Generated by sqlc from the migrations. Do not comment on this file; a
        wrong type here comes from the column definition in migrations/.

    - path: "migrations/*.sql"
      instructions: >-
        Migrations are append-only. A migration that has already been applied is
        never edited: a fix is a new numbered migration. Flag any change to an
        existing migration file. sqlc reads these same files as the schema, so a
        column change here must be matched by regenerated output in
        internal/store.

    - path: "**/*_test.go"
      instructions: >-
        Judge a test by whether it fails when the bug it names is present. Say
        so when a test would still pass with the behaviour it claims to protect
        removed, when its comment claims more than the assertions prove, and
        when concurrency is asserted by starting goroutines without controlling
        the interleaving they are supposed to expose.

    - path: "internal/user/**"
      instructions: >-
        Authentication code. Check that failure modes stay indistinguishable to
        the caller (an unknown, expired and already-spent token must return one
        error, never three), that a login token is only ever persisted as a
        digest, and that consuming a token cannot succeed twice under concurrent
        requests.

knowledge_base:
  # Local everywhere: this repository is all rights reserved, and its decisions
  # are its own. Nothing learned here should surface in another repository.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/architecture.md"
      - "docs/decisions/*.md"
