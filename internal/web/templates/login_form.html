<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<h1>Sign in</h1>
<form method="post" action="/login">
<label for="email">Email address</label>
<input type="email" id="email" name="email" required>
<button type="submit">Send sign-in link</button>
</form>
{{with .Error}}<p role="alert">{{.}}</p>{{end}}
</body>
</html>
