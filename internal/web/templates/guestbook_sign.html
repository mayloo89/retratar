<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Firmá el libro de {{.Name}} · retratar</title>
<link rel="stylesheet" href="/app.css">
</head>
<body{{with .MoodClass}} class="mood-{{.}}"{{end}}>
<header class="top"><a class="mark" href="/"><img src="/favicon.svg" width="20" height="20" alt="">retratar</a></header>
<main class="sheet">
<div class="signhead"><span class="frame" aria-hidden="true">{{.Initial}}</span><div><strong>{{.Name}}</strong><span>{{.Address}}</span></div></div>
<h1>Firmá su libro</h1>
<div class="body">
{{if .CanSign}}
<form method="post" action="/sign/{{.Handle}}">
<div class="field"><label for="body">Tu mensaje</label>
<textarea id="body" name="body" maxlength="280" rows="5" required>{{.Body}}</textarea>
<p class="help">Hasta 280 caracteres. Va a aparecer en la página de {{.Name}}, con tu dirección.</p></div>
<div class="actions"><button type="submit">Firmar</button></div>
</form>
{{with .Error}}<p role="alert">{{.}}</p>{{end}}
<p class="back"><a href="{{.PageURL}}">Volver a la página de {{.Handle}}</a></p>
{{else}}
<p>{{.Message}}</p>
<p><a href="{{.MessageURL}}">{{.MessageLink}}</a></p>
{{end}}
</div>
</main>
</body>
</html>
