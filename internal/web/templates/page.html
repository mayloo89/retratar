<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{.Handle}}</title>
<link rel="stylesheet" href="/theme.css">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Handle}}">
<meta property="og:description" content="{{.OGDescription}}">
<meta property="og:url" content="{{.OGURL}}">
<meta property="og:image" content="{{.OGImageURL}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="blk-mood mood-{{.MoodClass}}">
<h1 class="blk-identity">{{.Handle}}</h1>
{{if .HasMood}}
<p class="blk-mood-label">{{.MoodLabel}}</p>
{{if .MoodNote}}<p class="blk-mood-note">{{.MoodNote}}</p>{{end}}
{{else}}
<p class="blk-mood-empty">{{.OGDescription}}</p>
{{end}}
</body>
</html>
